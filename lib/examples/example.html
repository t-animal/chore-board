<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Calendar API Browser Example</title>
  <script async defer src="https://apis.google.com/js/api.js" ></script>
  <script src="https://accounts.google.com/gsi/client" async onload="googleIdentityServicesTrampoline()"></script> <!-- Google Identity Services -->

  <script type="importmap">
  {
    "imports": {
      "temporal-polyfill": "../node_modules/temporal-polyfill/index.js"
    }
  }
  </script>

  <script>
    googleIdentityServicesTrampoline = () => {
      if(typeof window.googleIdentityServicesLoaded !== 'function') {
        console.log("Google Identity Services waiting for module to load");
        window.setTimeout(googleIdentityServicesTrampoline, 50);
        return;
      }
      window.googleIdentityServicesLoaded();
    };
  </script>
  <script type="module">
    const CLIENT_ID = "278763558543-89sp3t9k6na9bvt9mdfj3u424v0v7l1k.apps.googleusercontent.com"; // Replace with your client ID
    const SCOPE = "https://www.googleapis.com/auth/calendar";

    window.googleIdentityServicesLoaded = googleIdentityServicesTrampoline;

    async function listCalendarsUsingFacade(accessToken) {
      const { getGcalApi, listCalendars } = await import('../dist/index.js');

      try {
        const api = await getGcalApi({ accessToken }, 'browser');
        const calendars = await listCalendars(api);

        if (!calendars || calendars.length === 0) {
          document.getElementById('content').innerText = 'No calendars found.';
          return;
        }

        const output = calendars.reduce(
          (str, calendar) => `${str}${calendar.title}\n`,
          'Calendars:\n'
        );
        document.getElementById('content').innerText = output;
      } catch (err) {
        document.getElementById('content').innerText = `Error: ${err.message} \n@ ${err.stack}`;
      }
    }

    function googleIdentityServicesTrampoline() {
      // The Calendar API needs an OAuth access token, so use the token client
      // (google.accounts.oauth2) rather than One Tap, which only signs the user
      // in and returns an ID token.
      // https://developers.google.com/identity/oauth2/web/guides/use-token-model
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPE,
        callback: (response) => {
          if (!response.access_token) {
            document.getElementById('content').innerText =
              `Error: ${response.error_description || response.error}`;
            return;
          }
          listCalendarsUsingFacade(response.access_token);
        },
        error_callback: (error) => {
          document.getElementById('content').innerText = `Error: ${error.message}`;
        },
      });

      const button = document.getElementById('authorize');
      // requestAccessToken opens a popup, so it needs a user gesture.
      button.onclick = () => tokenClient.requestAccessToken();
      button.disabled = false;
      document.getElementById('content').innerText = 'Click "Authorize" to list your calendars.';
    };

  </script>


</head>
<body>
  <h1>Google Calendar API Browser Example</h1>
  <button id="authorize" type="button" disabled>Authorize</button>
  <pre id="content" style="white-space: pre-wrap;">Loading...</pre>
</body>
</html>
